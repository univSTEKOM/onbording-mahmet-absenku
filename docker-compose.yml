services:
  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    container_name: absenku-api
    ports:
      - "3001:3001"
    environment:
      - BETTER_AUTH_SECRET=dev-secret-key-this-is-just-for-local-dev-env
      - DEMO_PASSWORD=password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/me', r => {process.exit(r.statusCode===401?0:1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: absenku-web
    ports:
      - "5173:80"
    depends_on:
      mock-api:
        condition: service_healthy
    restart: unless-stopped
