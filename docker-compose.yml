services:
  minio:
    image: minio/minio:latest
    container_name: absenku-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absenku-backend
    environment:
      - PORT=9090
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-this-in-production-min-32-chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-password}
      - APP_RELEASE_DATE=${APP_RELEASE_DATE:-2026-07-13}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET_FOTO=${MINIO_BUCKET_FOTO:-absenku-foto}
      - MINIO_BUCKET_ABSENSI=${MINIO_BUCKET_ABSENSI:-absenku-absensi}
    ports:
      - "${BACKEND_PORT:-9090}:9090"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_APP_NAME=${VITE_APP_NAME:-AbsenKu}
        - VITE_APP_RELEASE_DATE=${APP_RELEASE_DATE:-2026-07-13}
    container_name: absenku-web
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  minio-data:
